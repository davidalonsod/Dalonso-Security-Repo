id: c6d2e4f5-a0b1-3c7d-8e9f-0a1b2c3d4e5f
name: Service Principal Authenticating from Anomalous IP Spread
version: 1.1.0
kind: Scheduled
description: |
  Detects service principals (workload identities) successfully authenticating from
  9 or more distinct IP addresses in a 24-hour period. Legitimate service principals
  typically authenticate from a stable set of IPs (application servers, pipelines).
  Wide IP spread indicates compromised service principal credentials being used
  from multiple attacker machines or distributed attack infrastructure.
  MITRE ATT&CK: T1078.004 (Cloud Accounts), T1528
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AADServicePrincipalSignInLogs
queryFrequency: 4h
queryPeriod: 24h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
  - Persistence
  - LateralMovement
relevantTechniques:
  - T1078
  - T1528
query: |
  AADServicePrincipalSignInLogs
  | invoke ExcludeAllowlistedIPs_AADNI()
  | where TimeGenerated > ago(24h)
  | where ResultType == 0
  | summarize
      SignInCount = count(),
      UniqueIPs   = dcount(IPAddress),
      IPs         = make_set(IPAddress),
      Countries   = make_set(Location),
      FirstSeen   = min(TimeGenerated)
    by ServicePrincipalName, ServicePrincipalId, AppId
  | where UniqueIPs > 8
  | extend IPAddress = tostring(IPs[0])
  | order by UniqueIPs desc
entityMappings:
  - entityType: CloudApplication
    fieldMappings:
      - identifier: Name
        columnName: ServicePrincipalName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
customDetails:
  ServicePrincipalId: ServicePrincipalId
  UniqueIPCount: UniqueIPs
  Countries: Countries
alertDetailsOverride:
  alertDisplayNameFormat: "Service Principal Anomaly - {{ServicePrincipalName}} authenticated from {{UniqueIPs}} distinct IPs"
  alertDescriptionFormat: "Service principal '{{ServicePrincipalName}}' authenticated from {{UniqueIPs}} distinct IPs in 24 hours. Stable IP footprint expected for workload identities. Investigate for credential compromise."
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: AnyAlert
    groupByEntities:
      - CloudApplication
    groupByAlertDetails: []
    groupByCustomDetails: []
