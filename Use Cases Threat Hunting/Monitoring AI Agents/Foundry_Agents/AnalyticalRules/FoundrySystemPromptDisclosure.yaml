id: e7f8091a-dddd-4007-920a-0123456789db
name: Foundry - System prompt / instruction disclosure
description: |
  Detects a Foundry / Agent Service exchange where the user probes for the
  agent's system prompt, developer message or hidden instructions AND the
  agent's response echoes instruction-like content back. This is the
  system-prompt-disclosure shape (OWASP LLM07): a successful extraction of
  the guardrails, persona or tool list that an attacker then uses to craft
  targeted jailbreaks.

  Reads protected AppGenAIContent with legacy AppDependencies fallback
  and deduplicates by trace/span during the migration period. Without
  approved content recording this rule will not fire. The phrase lists
  are deliberately broad; review and tune them for legitimate prompts.
  Input and output text are used for matching but never returned in the
  alert result.
severity: High
requiredDataConnectors:
- connectorId: ApplicationInsights
  dataTypes:
  - AppDependencies
  - AppGenAIContent
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: gt
triggerThreshold: 0
enabled: true
tactics:
- Collection
- CredentialAccess
relevantTechniques:
- T1213
- T1552
query: |
  union isfuzzy=true
  (AppDependencies
  | extend ContentKey = strcat(OperationId, ":", Id),
      Agent = tostring(Properties["gen_ai.agent.name"]),
      Model = tostring(Properties["gen_ai.request.model"]),
      ConvId = tostring(Properties["gen_ai.conversation.id"]),
      ProjectId = tostring(Properties["microsoft.foundry.project.id"]),
      Input = tolower(tostring(Properties["gen_ai.input.messages"])),
      Output = tostring(Properties["gen_ai.output.messages"])),
  (AppGenAIContent
  | extend ContentKey = strcat(TraceId, ":", SpanId), Agent = tostring(AgentName),
      Model = tostring(ModelName), ConvId = tostring(Attributes["gen_ai.conversation.id"]),
      ProjectId = tostring(Attributes["microsoft.foundry.project.id"]),
      Input = tolower(tostring(InputMessages)), Output = tostring(OutputMessages))
  | where isnotempty(Output)
  | summarize arg_max(TimeGenerated, *) by ContentKey
  | extend AskedForPrompt = Input has_any (
        "system prompt", "initial instructions", "your instructions",
        "reveal your prompt", "repeat the words above", "what are your rules",
        "developer message", "print your system", "show me your prompt",
        "ignore previous instructions", "what is your system message",
        "everything above this line", "verbatim instructions")
  | extend LeakMarker = Output has_any (
        "you are an", "your role is", "# system", "system prompt",
        "you must never", "do not reveal", "your instructions are",
        "as an ai assistant", "you have access to the following tools",
        "your available tools", "you should always", "never disclose")
  | where AskedForPrompt and LeakMarker
  | extend AccountName = iff(isempty(Agent), "unknown-agent", Agent)
  | project
      TimeGenerated, AccountName, Agent, Model, ProjectId, ConvId,
      AskedForPrompt, LeakMarker
  | order by TimeGenerated desc
entityMappings:
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: AccountName
- entityType: CloudApplication
  fieldMappings:
  - identifier: Name
    columnName: Model
eventGroupingSettings:
  aggregationKind: SingleAlert
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT6H
    matchingMethod: Selected
    groupByEntities:
    - Account
    groupByAlertDetails: []
    groupByCustomDetails: []
version: 1.0.0
kind: Scheduled
tags:
- Sentinel-As-Code
- Custom
- Foundry
- AI
- OWASP-LLM07
