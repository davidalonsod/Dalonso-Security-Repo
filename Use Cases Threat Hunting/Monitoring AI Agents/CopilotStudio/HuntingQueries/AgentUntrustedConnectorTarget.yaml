id: b2c3d4e5-2009-4b22-9d01-0123456789c9
name: Copilot Studio - Untrusted connector target (allowlist join)
description: |
  Flags Copilot Studio connector / action calls or environment-level MCP
  tools whose target identifier is not
  on the approved CopilotStudioTrustedConnectors watchlist (column
  ConnectorTarget). A fetch or action against a host outside the approved
  set can indicate a poisoned / rogue action, data egress to an attacker-
  controlled endpoint, or configuration drift.

  Returns rows only once the CopilotStudioTrustedConnectors watchlist is
  populated with your approved connector target prefixes, full Target paths,
  or exact gen_ai.tool.name values. Supports legacy connector rows and modern
  ExecuteTool spans. Seed it before relying on this hunt.
query: |
  let lookback = 1d;
  let trusted =
      _GetWatchlist('CopilotStudioTrustedConnectors')
      | project ConnectorTarget = tolower(tostring(column_ifexists('ConnectorTarget', '')))
      | where isnotempty(ConnectorTarget);
    let Legacy = AppDependencies
    | where TimeGenerated > ago(lookback)
    | where AppRoleName == "Microsoft Copilot Studio" or DependencyType == "Connector"
    | extend ConvId = tostring(Properties["conversationId"]),
         ChannelId = tostring(Properties["channelId"]),
         Tool = Name, ToolType = "MCP - connector telemetry",
         ResourceKey = tolower(tostring(Target)),
         ResourcePrefix = tolower(tostring(split(Target, "/")[0])),
         Source = "Agent-level connector";
    let Modern = AppDependencies
    | where TimeGenerated > ago(lookback)
    | where tostring(Properties["gen_ai.operation.name"]) == "execute_tool"
    | extend Tool = tostring(Properties["gen_ai.tool.name"]),
         ToolType = tostring(Properties["gen_ai.tool.type"])
    | where Tool has "mcp" or ToolType has "mcp"
    | extend ConvId = tostring(Properties["gen_ai.conversation.id"]), ChannelId = "",
         ResourceKey = tolower(iff(Target == "GenAI" or isempty(Target), Tool, tostring(Target))),
         ResourcePrefix = tolower(tostring(split(iff(Target == "GenAI" or isempty(Target), Tool, tostring(Target)), "/")[0])),
         Source = "Environment ExecuteTool";
    union Legacy, Modern
    | extend Trusted = ResourcePrefix in (trusted) or ResourceKey in (trusted)
  | where not(Trusted)
    | summarize Calls = count(), Convs = make_set(ConvId, 25),
      Channels = make_set(ChannelId, 10), FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated)
      by Tool, ToolType, Target, ResourceKey, ResourcePrefix, Source
  | order by Calls desc
tactics:
  - Exfiltration
  - CommandAndControl
techniques:
  - T1567
  - T1071
tags:
  - Sentinel-As-Code
  - Custom
  - CopilotStudio
  - AI
  - MCP
