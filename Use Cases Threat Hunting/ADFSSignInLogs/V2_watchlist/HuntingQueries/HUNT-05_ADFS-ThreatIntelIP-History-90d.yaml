id: a1f00005-0005-4005-9005-adfs00000005
name: HUNT-05 ADFS TOR / Threat-Intel IP History (90d)
description: |
  Joins ADFSSignInLogs against ThreatIntelligenceIndicator (active IP IoCs)
  over 90 days. Surfaces historical authentication attempts from known-bad
  infrastructure that may not have triggered a real-time analytic rule.
severity: High
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - ADFSSignInLogs
  - connectorId: ThreatIntelligence
    dataTypes:
      - ThreatIntelligenceIndicator
tactics:
  - InitialAccess
  - CommandAndControl
relevantTechniques:
  - T1090.003
  - T1078
query: |
  let TIIPs = ThreatIntelligenceIndicator
    | where TimeGenerated > ago(14d)
    | where Active == true and isnotempty(NetworkIP)
    | summarize arg_max(TimeGenerated, *) by IndicatorId
    | project IndicatorId, NetworkIP, ThreatType, Description;
  ADFSSignInLogs
  | invoke ExcludeAllowlistedIPs()
  | where TimeGenerated > ago(90d)
  | join kind=inner (TIIPs) on $left.IPAddress == $right.NetworkIP
  | summarize
      Attempts        = count(),
      SuccessfulAuth  = countif(ResultType == 0),
      UniqueUsers     = dcount(UserPrincipalName),
      Users           = make_set(UserPrincipalName, 25),
      ThreatTypes     = make_set(ThreatType, 10),
      FirstSeen       = min(TimeGenerated),
      LastSeen        = max(TimeGenerated)
    by IPAddress
  | order by SuccessfulAuth desc, Attempts desc
