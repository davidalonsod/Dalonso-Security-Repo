id: b2c3d4e5-0002-4f60-9012-bbccddeeff01
name: Privileged Role Assigned by Service Principal Outside PIM
description: |
  Detects when a Service Principal (application identity — not a human user) directly
  assigns a privileged Entra ID directory role via "Core Directory" without PIM
  involvement. This is a key post-exploitation step in attacks where an SP has been
  granted RoleManagement.ReadWrite.Directory and uses it to silently escalate
  privileges — a technique automated by AADInternals, CloudKatana, and 
  MicroBurst.

  HOW THIS DIFFERS FROM BUILT-IN "Privileged Role Assigned Outside PIM":
  The two built-in rules ("Privileged Role Assigned Outside PIM" and its NRT variant)
  alert on ALL non-PIM role assignments, including legitimate human admins using the
  portal/PowerShell before PIM was enforced. This rule narrows the scope to
  Service Principal actors only, producing higher-fidelity alerts specifically for
  the automated attack path — an SP assigning a role to itself, to another SP, or to
  a user account without any human involvement.

  Reference: AADInternals   https://github.com/Gerenios/AADInternals
             CloudKatana     https://github.com/Azure/CloudKatana
             MicroBurst      https://github.com/NetSPI/MicroBurst
             MITRE           T1098.003 – Additional Cloud Roles
severity: High
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - AuditLogs
queryFrequency: 15m
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
status: Available
tactics:
  - PrivilegeEscalation
  - Persistence
relevantTechniques:
  - T1098.003
  - T1078.004
query: |
  AuditLogs
  | where TimeGenerated > ago(1d)
  | where ActivityDisplayName in (
      "Add member to role",
      "Add eligible member to role",
      "Add scoped member to role",
      "Add permanent member to role",
      "Add app role assignment to service principal")
  | where LoggedByService !in ("PIM", "Privileged Identity Management")
  | where Result == "success"
  // Restrict to Service Principal actors — the uniquely dangerous attack path
  | where isnotempty(tostring(InitiatedBy.app.servicePrincipalId))
  | where isempty(tostring(InitiatedBy.user.userPrincipalName))
  | extend ActingAppDisplayName     = tostring(InitiatedBy.app.displayName)
  | extend ActingAppServicePrincipalId = tostring(InitiatedBy.app.servicePrincipalId)
  | extend ActingAppId              = tostring(InitiatedBy.app.appId)
  | extend TargetUser               = tostring(TargetResources[0].displayName)
  | extend TargetUserUPN            = tostring(TargetResources[0].userPrincipalName)
  | extend TargetUserId             = tostring(TargetResources[0].id)
  | extend TargetType               = tostring(TargetResources[0].type)
  | extend RoleName                 = tostring(TargetResources[1].displayName)
  | project
      TimeGenerated,
      ActingAppDisplayName,
      ActingAppServicePrincipalId,
      ActingAppId,
      TargetUser,
      TargetUserUPN,
      TargetUserId,
      TargetType,
      RoleName,
      ActivityDisplayName,
      LoggedByService,
      AADOperationType,
      CorrelationId

entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: ActingAppDisplayName
      - identifier: AadUserId
        columnName: ActingAppServicePrincipalId
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: TargetUserUPN

customDetails:
  ActingServicePrincipal: ActingAppDisplayName
  ActingAppId: ActingAppId
  RoleAssigned: RoleName
  TargetObjectType: TargetType

alertDetailsOverride:
  alertDisplayNameFormat: "SP-initiated non-PIM role assignment: '{{RoleName}}' granted to {{TargetUser}} by app {{ActingAppDisplayName}}"
  alertDescriptionFormat: "Service Principal '{{ActingAppDisplayName}}' ({{ActingAppServicePrincipalId}}) assigned the role '{{RoleName}}' to {{TargetUser}} ({{TargetUserUPN}}) without PIM. This is an automated privilege escalation indicator — no human actor was involved."

suppressionDuration: PT1H
suppressionEnabled: false
version: 1.0.0
kind: Scheduled
